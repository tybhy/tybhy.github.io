<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script>window.__DEMO_APP="ai-teaching";window.__DEMO_BASE=/demo/;window.__DEMO_HOSTS=[];</script><script src="/demo/data.js"></script><script src="/demo/engine.js"></script><script src="/demo/app-ai-teaching.js"></script><script src="/demo/demo-hook.js"></script>
    <link rel="icon" type="image/svg+xml" href="/apps/ai-teaching/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>产教融合在线教育平台</title>
    <script type="module" crossorigin src="/apps/ai-teaching/assets/index-WXUrmxjy.js"></script>
    <link rel="stylesheet" crossorigin href="/apps/ai-teaching/assets/index-CkZBz69M.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    /* ═════════ 演示模式（?demo=1）· 2026-10-27 ═════════
       登录用应用自带的登录页（不另做一套皮），只做两件事：
       1. 自动填入演示账号密码，访客点一下「登录」即可；
       2. 登录后底部浮出引导条，可切换教师 / 学生视角。 */
    (function(){
      if(location.search.indexOf('demo=1') < 0) return;

      var ACC = 'zhangqm';      /* 教师账号，对应 mock 里的朱建宇 */
      var PWD = 'demo1234';

      /* 每次新开演示都从登录页进；只有「切视角」触发的 reload 保留登录态 */
      var keep = false;
      try {
        keep = sessionStorage.getItem('td_keep') === '1';
        sessionStorage.removeItem('td_keep');
      } catch(e) {}
      if(!keep && location.search.indexOf('as=') < 0){
        try { localStorage.removeItem('token'); } catch(e) {}
      }

      var css = document.createElement('style');
      css.textContent = [
        '.td-guide{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(8px);z-index:9980;',
        'display:flex;align-items:center;gap:12px;max-width:86%;background:rgba(17,24,34,.92);color:#e8edf4;',
        'border-radius:22px;padding:8px 10px 8px 18px;font-size:12.5px;box-shadow:0 14px 34px -16px rgba(0,0,0,.5);',
        'opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.16,1,.3,1);}',
        '.td-guide.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}',
        '.td-guide .dot{width:7px;height:7px;border-radius:50%;background:#60a5fa;flex:none;animation:tdg 1.5s ease-in-out infinite;}',
        '@keyframes tdg{0%,100%{opacity:.25}50%{opacity:1}}',
        '.td-guide button{border:1px solid rgba(232,237,244,.35);background:transparent;color:#dbe4ee;',
        'border-radius:14px;padding:3px 12px;font-size:11px;cursor:pointer;white-space:nowrap;}',
        '.td-guide button:hover{color:#fff;border-color:rgba(232,237,244,.7);}'
      ].join('');
      document.head.appendChild(css);

      function token(){ try{ return localStorage.getItem('token') || ''; }catch(e){ return ''; } }
      function role(){
        var t = token();
        if(t.indexOf('admin') >= 0) return 'admin';
        return t.indexOf('zhangqm') >= 0 ? 'teacher' : 'student';
      }

      /* ── 登录后常驻的引导条：引导 + 视角切换 ── */
      var guide = null;
      function mountGuide(){
        if(guide && guide.parentNode) return;
        var r = role();
        if(r === 'admin') return;
        var g = document.createElement('div');
        g.className = 'td-guide';
        g.innerHTML = '<span class="dot"></span>'
          + '<span>' + (r === 'teacher'
            ? '核心演示 · 「作业管理」跑一次 AI 批量评分：批量评分 → 人工复核 → 导出 CSV；科目里可按班级一键分配'
            : '学生视角 · 学生看到的提交与评分（86 分 + 教师评语）——评分链路的最后一环') + '</span>'
          + '<button class="sw">' + (r === 'teacher' ? '切学生视角' : '切回教师视角') + '</button>';
        g.querySelector('.sw').addEventListener('click', function(){
          try{
            localStorage.setItem('token', r === 'teacher' ? 'demo.3124003080' : 'demo.zhangqm');
            sessionStorage.setItem('td_keep', '1');
          }catch(e){}
          location.reload();
        });
        document.body.appendChild(g);
        guide = g;
        setTimeout(function(){ g.classList.add('on'); }, 900);
      }
      function unmountGuide(){
        if(guide && guide.parentNode){ guide.parentNode.removeChild(guide); }
        guide = null;
      }

      /* ── 自动填入：写进应用自带登录表单（受控组件要走原生 setter + input 事件）── */
      function setVal(el, v){
        var desc = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value');
        desc.set.call(el, v);
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }
      function fillLogin(){
        var form = document.querySelector('form');
        if(!form) return false;
        var us = form.querySelector('input[placeholder="输入用户名"]') || form.querySelector('input[type="text"]');
        var pw = form.querySelector('input[placeholder="输入密码"]');
        if(!us || !pw) return false;
        if(us.value !== ACC) setVal(us, ACC);
        if(pw.value !== PWD) setVal(pw, PWD);
        return true;
      }

      /* ── 轮询：未登录时填表；登录后挂引导条；登出后再填一次 ── */
      var filled = false, wasIn = false;
      setInterval(function(){
        if(token()){
          wasIn = true;
          if(!guide) mountGuide();
          return;
        }
        unmountGuide();
        if(wasIn){ filled = false; wasIn = false; }
        if(!filled && fillLogin()) filled = true;
      }, 200);
    })();
    </script>
  </body>
</html>
